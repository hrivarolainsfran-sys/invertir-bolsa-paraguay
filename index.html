<style>
/* Layout: fintech de una columna, bandas alternas claro/blanco, contenido máx. 1152px, nav fija arriba */
:root {
  --bg: 248 250 252;        /* #F8FAFC */
  --card: 255 255 255;
  --ink: 15 23 42;          /* #0F172A azul marino */
  --muted: 71 85 105;
  --line: 226 232 240;
  --soft: 241 245 249;
  --em: 5 150 105;          /* #059669 esmeralda */
  --em-soft: 236 253 245;
  --amber: 180 83 9;
  --amber-soft: 255 247 237;
  --navy: 15 23 42;
  --navy-fg: 248 250 252;
  --red: 185 28 28;
  --red-soft: 254 242 242;
  --up: 52 211 153;          /* verde de cotización sobre fondo oscuro */
  --gold: 251 191 36;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --font-display: "Plus Jakarta Sans", "Inter", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: 10 15 28; --card: 17 24 39; --ink: 241 245 249; --muted: 148 163 184; --line: 38 50 71;
    --soft: 24 33 52; --em: 52 211 153; --em-soft: 6 46 36; --amber: 251 191 36; --amber-soft: 54 38 10;
    --navy: 30 41 66; --navy-fg: 241 245 249; --red: 248 113 113; --red-soft: 60 20 20;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: 10 15 28; --card: 17 24 39; --ink: 241 245 249; --muted: 148 163 184; --line: 38 50 71;
  --soft: 24 33 52; --em: 52 211 153; --em-soft: 6 46 36; --amber: 251 191 36; --amber-soft: 54 38 10;
  --navy: 30 41 66; --navy-fg: 241 245 249; --red: 248 113 113; --red-soft: 60 20 20;
  color-scheme: dark;
}
html { scroll-behavior: smooth; }
body { background: rgb(var(--bg)); color: rgb(var(--ink)); font-family: var(--font-body); font-size: 1rem; line-height: 1.6; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: rgb(var(--navy)); }
h1, h2, h3, h4 { font-family: var(--font-display); text-wrap: balance; letter-spacing: -0.02em; line-height: 1.15; }
.wrap { max-width: 1152px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.num { font-variant-numeric: tabular-nums; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: rgb(var(--em)); }
.prose-w { max-width: 65ch; }
section[id] { scroll-margin-top: 140px; }
@media (min-width: 1024px) { section[id] { scroll-margin-top: 190px; } }
@media (min-width: 1280px) { section[id] { scroll-margin-top: 145px; } }
.board-bg { background-image: radial-gradient(60rem 30rem at 85% -10%, rgb(var(--up) / .14), transparent 60%), linear-gradient(rgb(var(--navy-fg) / .05) 1px, transparent 1px), linear-gradient(90deg, rgb(var(--navy-fg) / .05) 1px, transparent 1px); background-size: auto, 32px 32px, 32px 32px; }
.ticker-track { display: inline-block; animation: ticker 70s linear infinite; }
.ticker-track:hover { animation-play-state: paused; }
@keyframes ticker { from { transform: translateX(0); } to { transform: translateX(-50%); } }
:focus-visible { outline: 2px solid rgb(var(--em)); outline-offset: 2px; border-radius: 6px; }
input[type=range] { accent-color: rgb(var(--em)); }
.fade-in { animation: fadeIn .35s ease both; }
@keyframes fadeIn { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .fade-in, .ticker-track { animation: none; } * { transition: none !important; } }
.recharts-cartesian-axis-tick-value { fill: rgb(var(--muted)); font-size: 12px; }
.recharts-cartesian-grid line { stroke: rgb(var(--line)); }
main > section:nth-of-type(even) { background: rgb(var(--soft) / .6); border-block: 1px solid rgb(var(--line)); }
#boot-msg { padding: 48px 16px; text-align: center; color: rgb(var(--muted)); }

/* ---------- v7: experiencia más amena e interactiva ---------- */
:root { --shadow: 15 23 42; }
:root[data-theme="dark"] { --shadow: 0 0 0; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --shadow: 0 0 0; } }
[data-reveal] { transition: opacity .7s ease, transform .7s cubic-bezier(.2,.7,.2,1) !important; transition-delay: var(--rd, 0ms) !important; }
[data-reveal=""] { opacity: 0; transform: translateY(22px); }
[data-reveal="in"] { opacity: 1; transform: none; }
main .rounded-2xl.border.bg-card { transition: border-color .25s ease, box-shadow .25s ease, transform .25s ease, background-color .25s ease; }
main .rounded-2xl.border.bg-card:hover { box-shadow: 0 22px 44px -28px rgb(var(--shadow) / .45); }
main a.rounded-2xl:hover, main article.rounded-2xl:hover { transform: translateY(-3px); }
main button.rounded-xl:not(:disabled):active, main button.rounded-lg:not(:disabled):active, main button.rounded-2xl:not(:disabled):active { transform: scale(.97); }
.caminos-wrap { background: linear-gradient(to bottom, transparent 48px, rgb(var(--soft) / .6) 48px); }
@media (min-width: 640px) { .caminos-wrap { background: linear-gradient(to bottom, transparent 56px, rgb(var(--soft) / .6) 56px); } }
.caminos-wrap + section { border-top: 0 !important; }
.caminos { box-shadow: 0 30px 60px -30px rgb(var(--shadow) / .45); }
.hero-grad { background: linear-gradient(90deg, rgb(var(--up)), #A7F3D0 45%, rgb(var(--gold))); -webkit-background-clip: text; background-clip: text; color: transparent; padding-bottom: .08em; }
.hero-range { accent-color: rgb(var(--up)); height: 22px; cursor: pointer; }
.orb { position: absolute; border-radius: 9999px; filter: blur(70px); pointer-events: none; animation: orb 16s ease-in-out infinite; }
.orb-a { width: 380px; height: 380px; background: rgb(52 211 153 / .22); top: -160px; left: -120px; }
.orb-b { width: 320px; height: 320px; background: rgb(251 191 36 / .12); bottom: -160px; right: 18%; animation-delay: -7s; }
@keyframes orb { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(40px, 26px); } }
.float-slow { animation: floaty 9s ease-in-out infinite; }
@keyframes floaty { 0%, 100% { transform: translateY(0) rotate(-8deg); } 50% { transform: translateY(-14px) rotate(-3deg); } }
.pop { animation: pop .4s cubic-bezier(.2,.8,.2,1); }
@keyframes pop { from { transform: scale(.94); opacity: .4; } to { transform: none; opacity: 1; } }
.word-in { animation: wordIn .55s cubic-bezier(.2,.8,.2,1); }
@keyframes wordIn { from { opacity: 0; transform: translateY(.35em); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
.pop-in { animation: popIn .22s cubic-bezier(.2,.8,.2,1); }
@keyframes popIn { from { opacity: 0; transform: translateY(-10px) scale(.98); } to { opacity: 1; transform: none; } }
.slide-in { animation: slideIn .3s cubic-bezier(.2,.8,.2,1); }
@keyframes slideIn { from { transform: translateX(100%); } to { transform: none; } }
.toast-in { animation: toastIn .4s cubic-bezier(.2,.8,.2,1); }
@keyframes toastIn { from { opacity: 0; transform: translateY(16px) scale(.96); } to { opacity: 1; transform: none; } }
.shine { position: relative; overflow: hidden; }
.shine::after { content: ""; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 35%, rgb(255 255 255 / .28) 50%, transparent 65%); transform: translateX(-100%); animation: shine 3.6s ease-in-out infinite; pointer-events: none; }
@keyframes shine { 55%, 100% { transform: translateX(100%); } }
/* v8: comprensión */
::highlight(gloss) { background-color: rgb(var(--em) / .10); text-decoration-line: underline; text-decoration-style: dotted; text-decoration-color: rgb(var(--em)); text-decoration-thickness: 2px; }
.gloss-hover, .gloss-hover * { cursor: help !important; }
.reading-now { background: rgb(var(--amber-soft)); box-shadow: 0 0 0 6px rgb(var(--amber-soft)); border-radius: 6px; transition: background .3s, box-shadow .3s; }
.eq { display: inline-flex; align-items: flex-end; gap: 2px; height: 12px; margin-left: 2px; }
.eq i { display: block; width: 3px; height: 100%; background: currentColor; border-radius: 2px; animation: eq .9s ease-in-out infinite; transform-origin: bottom; }
.eq i:nth-child(2) { animation-delay: -.3s; } .eq i:nth-child(3) { animation-delay: -.6s; }
@keyframes eq { 0%,100% { transform: scaleY(.3); } 50% { transform: scaleY(1); } }
@media (prefers-reduced-motion: reduce) { .eq i { animation: none; } }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 97; overflow: hidden; }
.confetti i { position: absolute; width: 8px; height: 12px; border-radius: 2px; animation: conf 1.7s cubic-bezier(.15,.6,.3,1) forwards; }
@keyframes conf { 0% { transform: translate(-50%, -50%); opacity: 1; } 45% { transform: translate(var(--dx), var(--dy)) rotate(calc(var(--r) * .5)); opacity: 1; } 100% { transform: translate(var(--dx), calc(var(--dy) + 340px)) rotate(var(--r)); opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  [data-reveal] { opacity: 1 !important; transform: none !important; }
  .orb, .float-slow, .pop, .word-in, .pop-in, .slide-in, .toast-in, .shine::after { animation: none !important; }
}

const fmtMoney = (v, cur) => {
  if (!isFinite(v)) v = 0;
  if (cur === "PYG") return "Gs. " + Math.round(v).toLocaleString("es-PY");
  return "US$ " + v.toLocaleString("es-PY", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
};
const fmtShort = (v, cur) => {
  const p = cur === "PYG" ? "Gs. " : "US$ ";
  if (Math.abs(v) >= 1e9) return p + (v / 1e9).toLocaleString("es-PY", {
    maximumFractionDigits: 1
  }) + " mil M";
  if (Math.abs(v) >= 1e6) return p + (v / 1e6).toLocaleString("es-PY", {
    maximumFractionDigits: 1
  }) + " M";
  if (Math.abs(v) >= 1e3) return p + (v / 1e3).toLocaleString("es-PY", {
    maximumFractionDigits: 0
  }) + " mil";
  return p + Math.round(v);
};
